config_format: negf-tdp-ps-scba

# Deliberately populated but weak-coupling phonon benchmark.  The phonon
# frequency follows the manuscript baseline; N0=1
# produces an occupation response without leaving the g=0.1 Gamma SCBA regime.
model:
  gamma_eV: 0.01
  gamma_left: 0.5
  gamma_right: 0.5
  epsilon_0: 0.0
  device_shift: 5.0
  left_shift: 10.0
  right_shift: 0.0
  beta: 10.0
  beta_ph: 3.4657359027997265
  phonon_energy: 0.2
  phonon_occupation: 1.0
  bandwidth: 20.0
  coupling_meV: 1.0

protocol:
  name: upward

projection:
  time_min: -2.0
  time_max: 3.0
  time_step: 0.01
  weight: uniform
  dense_validation: false
  reconstruction_lead: L
  lag_batch: 64
  energy_batch: 64

numerics:
  energy_min: -200.0
  energy_max: 200.0
  energy_step: 0.02
  eta: 1.0e-5
  stationary_max_iter: 200000
  stationary_tolerance_abs: 1.0e-7
  stationary_tolerance_rel: 1.0e-6
  stationary_mixing: 0.05
  outer_max_iter: 2000
  outer_tolerance: 1.0e-5
  outer_mixing: 0.05
  sigma_floor: 1.0e-12
  green_floor: 1.0e-12
  mpm_search_tolerance: 1.0e-6
  mpm_final_tolerance: 1.0e-8
  mpm_n_iw: 512
  mpm_beta_fit: 80.0
  mpm_aaa_initial_terms: 120
  mpm_aaa_max_terms: 480
  mpm_aaa_growth_factor: 1.5
  current_method: finite_window
  current_representation: psi
  checkpoint_every: 1
  enforce_hard_gates: true

plotting:
  enabled: true
  formats: [svg]
  style: serif_mathtext
  natural_units: true
  physical_qa_units: true
  physical_publication_figures: true
  separate_lead_currents: true
  automatic_qa_refresh: true
  use_external_latex: false

output_root: runs
