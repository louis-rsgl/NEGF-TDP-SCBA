    problems_solved:
      - "Construct a stationary retarded and lesser electron-phonon self-energy for a scalar Lorentzian quantum dot."
      - "Provide the protocol-specific stationary boundary frozen during a later voltage pulse."
    governing_equations:
      - "Scalar Dyson equation for G^R."
      - "Keldysh equation G^< = G^R (Sigma_lead^< + Sigma_ep^<) G^A."
      - "Single-mode shifted-frequency Born lesser and greater self-energies."
      - "Spectral principal-value construction of Sigma_ep,dyn^R plus scalar Hartree shift."
    method_type:
      - weak Born approximation
      - self-consistent Born approximation
      - fixed-point iteration
    applicable_when:
      - "The central region is the implemented scalar single-level model."
      - "One fixed stationary phonon mode and Lorentzian leads are appropriate."
      - "A strict O(g^2) or stationary self-consistent Born boundary is scientifically justified."
    limitations:
      - "No time-dependent self-energy update or phonon kinetics."
      - "No multiple orbitals, spin, multiple phonon modes, electron-electron interaction, or arbitrary lead spectrum."
