  - id: "minimal-pole-retarded-reduction"
    name: "Minimal-pole retarded self-energy reduction and Green-pole extraction"
    aliases:
      - "MPM retarded analytic continuation"
      - "arrowhead Dyson pole extraction"
      - "causal AAA fallback"
    domain:
      - analytic continuation
      - rational approximation
      - transient nonequilibrium Green functions
    problems_solved:
      - "Replace a causal real-grid retarded electron-phonon self-energy by a validated finite pole representation."
      - "Extract physical unbiased and biased Green-function poles for transient residue sums."
    governing_equations:
      - "Sigma_ep,dyn^R(z) approximately equals sum_j s_j/(z-zeta_j)."
      - "Dyson denominator roots obtained from a non-Hermitian arrowhead eigenproblem."
      - "Green residues obtained from the derivative of the Dyson denominator."
    method_type:
      - Minimal Pole Method
      - causal rational approximation
      - non-Hermitian eigenvalue reduction
    applicable_when:
      - "The dynamic retarded self-energy admits an accurate rational approximation on the relevant window."
      - "Repeated retarded transient evaluations benefit from finite residue sums."
    limitations:
      - "Scalar implementation only."
      - "Fails closed on reconstruction, causality, or pole-conditioning errors."
      - "Lesser functions remain real-grid data and are not analytically continued."
    extends:
      - method: "Minimal Pole Method"
        citation: "10.1103/PhysRevB.110.235131"
    contribution:
      type: "combined"
      description: "Uses published MPM, reconstructs two Dyson propagators from one fit, and applies repository validation gates; novelty of the combination requires author verification."
      novelty_author_verified: false
    introduced_in:
      title: "Minimal pole representation and analytic continuation of matrix-valued correlation functions"
