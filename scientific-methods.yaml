      - nonequilibrium Green functions
    problems_solved:
      - "Compute current after applying a voltage step to an unbiased connected scalar dot."
      - "Compute current after removing a voltage step from a biased stationary scalar dot."
      - "Retain Lorentzian finite-bandwidth lead memory with a frozen stationary electron-phonon kernel."
    governing_equations:
      - "Partition-free retarded Volterra/Dyson equation with frozen Sigma_ep."
      - "A, B, C, and D transient transforms."
