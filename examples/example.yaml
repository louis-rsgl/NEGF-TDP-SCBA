# Public quick-start configuration.  It is intentionally small enough to run
# on a laptop; use it as a template for a production configuration.
config_format: negf-tdp-ps-scba
model:
  gamma_eV: 0.01
  gamma_left: 0.5
  gamma_right: 0.5
  epsilon_0: 0.0
  device_shift: 0.4
  left_shift: 0.7
  right_shift: 0.0
  beta: 2.0
  beta_ph: 10.0
  phonon_energy: 1.0       # omega_0 / Gamma
  phonon_occupation: null  # thermal Bose occupation when null
  bandwidth: 3.0            # W / Gamma
  coupling_meV: 0.0         # g in meV; set >0 for PS-SCBA
protocol:
  name: upward                # upward, downward, square, or zero
  duration: null
projection:
  time_min: -0.5              # natural units hbar / Gamma
  time_max: 1.0
  time_step: 0.05
  weight: uniform
  dense_validation: false
  reconstruction_lead: L
  lag_batch: 32
  energy_batch: 32
  amplitude_time_batch: 16
numerics:
  energy_min: -12.0
  energy_max: 12.0
  energy_step: 0.1
  eta: 1.0e-4
  stationary_max_iter: 200
  stationary_tolerance_abs: 1.0e-7
  stationary_tolerance_rel: 1.0e-6
  stationary_mixing: 0.05
  outer_max_iter: 20
  outer_tolerance: 1.0e-5
  outer_mixing: 0.05
  sigma_floor: 1.0e-12
  green_floor: 1.0e-12
  mpm_search_tolerance: 1.0e-6
  mpm_final_tolerance: 1.0e-8
  mpm_n_iw: 64
  mpm_beta_fit: 40.0
  mpm_aaa_initial_terms: 16
  mpm_aaa_max_terms: 64
  mpm_aaa_growth_factor: 1.5
  current_energy_min: -12.0
  current_energy_max: 12.0
  current_energy_points: 241
  current_time_points: null
  current_method: finite_window
  current_representation: auto
  checkpoint_every: 1
  enforce_hard_gates: true
  verbose: false
campaign:
  bandwidths: [3.0]
  couplings_meV: [0.0, 0.1]
  phonon_energies: [1.0]
  protocols: [upward, downward, square]
  square_duration: 0.5
  time_max_by_protocol:
    upward: 1.0
    downward: 1.0
    square: 1.0
  compare_preparation_fixed: false
  max_workers: 2
  blas_threads: 1
tracking:
  enabled: true
  heartbeat_seconds: 60.0
  live_refresh_seconds: 10.0
  convergence_refresh_steps: 1
  resource_sampling: true
  memory_policy: warn
  memory_warning_factor: 1.25
plotting:
  enabled: true
  formats: [svg]
  style: serif_mathtext
  natural_units: true
  physical_qa_units: true
  physical_publication_figures: true
  separate_lead_currents: true
  automatic_qa_refresh: true
  use_external_latex: false
output_root: runs
